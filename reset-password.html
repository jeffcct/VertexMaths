<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — Vertex Maths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="wrap" id="page-wrap">

  <div class="topbar">
    <a class="brand" href="login.html">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">Vertex Maths</div>
        <div class="brand-sub">Year 11 &middot; Mathematics</div>
      </div>
    </a>
  </div>

  <div class="auth-card">
    <div class="auth-title">Set a new password</div>
    <div class="auth-sub">Choose a password for your account.</div>

    <div class="auth-message" id="reset-message"></div>

    <form id="reset-form" novalidate>
      <div class="auth-field">
        <label for="reset-password">New password</label>
        <input type="password" id="reset-password" autocomplete="new-password" required>
      </div>

      <div class="auth-field">
        <label for="reset-confirm">Confirm new password</label>
        <input type="password" id="reset-confirm" autocomplete="new-password" required>
      </div>

      <div class="auth-actions">
        <button type="submit" class="practice-check-btn" id="reset-submit-btn">Update password</button>
      </div>
    </form>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/reset-password-view.js"></script>
<script src="js/page-reset-password.js"></script>
</body>
</html>
