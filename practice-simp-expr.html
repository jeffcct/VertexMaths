<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice: Simplifying Expressions — Vertex Maths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/practice.css">
</head>
<body>
<div class="wrap wrap-wide" id="page-wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">Vertex Maths</div>
        <div class="brand-sub">Year 11 &middot; Mathematics</div>
      </div>
    </a>
    <div class="greeting">Kia ora, <b>Amelia</b> &mdash; Room 14</div>
  </div>

  <!-- ============ PracticeSimpExpr component ============ -->
  <section class="view" id="view-practice-simp-expr">

    <div class="breadcrumb">
      <button id="simpexpr-back-btn">← Algebra &amp; Graphing</button>
      <span class="sep">/</span>
      <span class="current">Practice: simplifying expressions</span>
    </div>

    <div class="practice-layout">
      <div class="equations-card">
        <div class="equation-label">Simplify</div>
        <div class="equation-line" id="simpexpr-expression"></div>
      </div>

      <div class="practice-panel-group">
      <div class="practice-panel">
        <div>
          <div class="practice-title" id="simpexpr-prompt">Simplify the expression.</div>
          <div class="practice-sub" id="simpexpr-sub"></div>
        </div>

        <div class="answer-row">
          <input type="text" id="simpexpr-answer-input" class="answer-input answer-input-wide" inputmode="text" autocomplete="off" aria-label="Simplified answer" placeholder="e.g. 3x + 5">
        </div>

        <div class="answer-hint" id="simpexpr-hint"></div>

        <div class="practice-actions">
          <button class="practice-check-btn" id="simpexpr-check-btn">Check answer</button>
          <button class="practice-next-btn" id="simpexpr-next-btn">New question</button>
        </div>

        <div class="feedback" id="simpexpr-feedback"></div>
        <div class="practice-score-row">Score: <span class="mono" id="simpexpr-score">0 / 0</span></div>
      </div>

      <div class="working-sidebar">
        <div class="working-card" id="simpexpr-working-card" hidden>
          <div class="equation-label">Working</div>
          <div class="working-lines" id="simpexpr-working-lines"></div>
        </div>
      </div>
      </div>
    </div>

    <footer>A freshly generated expression each time &middot; either collect like terms into Ax + B form, or multiply out a product of two different-letter terms</footer>
  </section>

</div>

<script src="js/equation-parse.js"></script>
<script src="js/working-trail.js"></script>
<script src="js/practice-simp-expr.js"></script>
<script src="js/page-practice-simp-expr.js"></script>
</body>
</html>
