<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vertex Maths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="wrap" id="page-wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">Vertex Maths</div>
        <div class="brand-sub">Year 11 &middot; Mathematics</div>
      </div>
    </a>
    <div class="greeting">Kia ora, <b>Amelia</b> &mdash; Room 14</div>
  </div>

  <!-- ============ HomeView component ============ -->
  <section class="view" id="view-home">

    <p class="eyebrow">Continue where you left off</p>
    <div class="resume">
      <div class="resume-body">
        <div class="resume-strand">Algebra &amp; Graphing &middot; Expanding &amp; factoring</div>
        <div class="resume-title">Factoring monic polynomials</div>
        <div class="resume-meta">
          <span class="mono">3 of 6 practice questions</span>
          <span class="progress-track"><span class="progress-fill" style="width:50%"></span></span>
        </div>
      </div>
      <button class="resume-btn" id="resume-btn">Resume →</button>
    </div>

    <p class="eyebrow">Pick a strand</p>
    <div class="strand-grid">

      <button class="strand-card active" id="card-algebra" aria-label="Open Algebra and Graphing">
        <span class="strand-glyph">y = mx + c</span>
        <div class="strand-name">Algebra &amp; Graphing</div>
        <div class="strand-count">32 skills &middot; 9 topic areas</div>
        <div class="strand-foot">
          <span class="strand-cta">Continue →</span>
          <span class="strand-progress"><span style="width:22%"></span></span>
        </div>
      </button>

      <button class="strand-card dummy number" data-strand="Number">
        <span class="strand-glyph">7/8</span>
        <div class="strand-name">Number</div>
        <div class="strand-count">12 topics</div>
        <div class="strand-foot">
          <span class="strand-cta">View strand →</span>
          <span class="badge-soon">Coming soon</span>
        </div>
        <div class="soon-note">Number activities are still being built — check back soon.</div>
      </button>

      <button class="strand-card dummy measurement" data-strand="Measurement">
        <span class="strand-glyph">V=πr²h</span>
        <div class="strand-name">Measurement</div>
        <div class="strand-count">10 topics</div>
        <div class="strand-foot">
          <span class="strand-cta">View strand →</span>
          <span class="badge-soon">Coming soon</span>
        </div>
        <div class="soon-note">Measurement activities are still being built — check back soon.</div>
      </button>

      <button class="strand-card dummy trig" data-strand="Trigonometry">
        <span class="strand-glyph">sin θ</span>
        <div class="strand-name">Trigonometry</div>
        <div class="strand-count">9 topics</div>
        <div class="strand-foot">
          <span class="strand-cta">View strand →</span>
          <span class="badge-soon">Coming soon</span>
        </div>
        <div class="soon-note">Trigonometry activities are still being built — check back soon.</div>
      </button>

    </div>

    <footer>Sample layout &middot; progress shown is placeholder data</footer>
  </section>

</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/toast.js"></script>
<script src="js/home-view.js"></script>
<script src="js/page-home.js"></script>
</body>
</html>
