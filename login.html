<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Vertex Maths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="wrap" id="page-wrap">

  <div class="topbar">
    <a class="brand" href="login.html">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">Vertex Maths</div>
        <div class="brand-sub">Mathematics</div>
      </div>
    </a>
  </div>

  <div class="auth-card">
    <div class="auth-title">Sign in</div>
    <div class="auth-sub">Use your email and password to continue.</div>

    <div class="auth-message" id="login-message"></div>

    <form id="login-form" novalidate>
      <div class="auth-field" id="login-name-field" hidden>
        <label for="login-full-name">Full name</label>
        <input type="text" id="login-full-name" autocomplete="name" placeholder="e.g. Amelia Smith">
      </div>

      <div class="auth-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required>
      </div>

      <div class="auth-field" id="login-password-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>

      <div class="auth-forgot" id="login-forgot-row">
        <button type="button" id="login-forgot-btn" class="auth-link-btn">Forgot password?</button>
      </div>

      <div class="auth-actions">
        <button type="submit" class="practice-check-btn" id="login-submit-btn">Sign in</button>
      </div>
    </form>

    <div class="auth-switch">
      <span id="login-switch-prompt">New here?</span>
      <button type="button" id="login-switch-btn">Create one</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/login-view.js"></script>
<script src="js/page-login.js"></script>
</body>
</html>
