<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice: Algebraic Perimeter — Vertex Maths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/exam.css">
</head>
<body>
<div class="wrap wrap-wide" id="page-wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">Vertex Maths</div>
        <div class="brand-sub">Year 11 &middot; Mathematics</div>
      </div>
    </a>
    <div class="topbar-account">
      <div class="greeting"></div>
      <a href="#" class="sign-out-link" data-auth="sign-out">Sign out</a>
    </div>
  </div>

  <!-- ============ PracticeAlgebraicPerimeter component ============ -->
  <section class="view" id="view-practice-algebraic-perimeter">

    <div class="breadcrumb">
      <button id="algperim-back-btn">← Exam Questions</button>
      <span class="sep">/</span>
      <span class="current">Algebraic perimeter</span>
    </div>

    <div class="practice-layout">
      <div class="shape-card">
        <svg id="algperim-shape-svg" class="shape-diagram" viewBox="0 0 300 220" role="img" aria-label="A shape with its sides labelled in terms of x"></svg>
        <div class="shape-not-to-scale">Diagram not to scale</div>
      </div>

      <div class="practice-panel-group">
      <div class="practice-panel">
        <div>
          <div class="practice-title">Solve for x</div>
        </div>

        <div class="step-prompt" id="algperim-statement"></div>

        <div class="answer-row">
          <span class="mono">x =</span>
          <input type="text" id="algperim-answer-input" class="answer-input" inputmode="text" autocomplete="off" aria-label="Value of x">
        </div>

        <div class="practice-actions">
          <button class="practice-check-btn" id="algperim-check-btn">Check answer</button>
          <button class="practice-next-btn" id="algperim-next-btn">New question</button>
        </div>

        <div class="feedback" id="algperim-feedback"></div>
        <div class="practice-score-row">Score: <span class="mono" id="algperim-score">0 / 0</span></div>
      </div>

      <div class="working-sidebar">
        <div class="working-card" id="algperim-working-card" hidden>
          <div class="equation-label">Working</div>
          <div class="working-lines" id="algperim-working-lines"></div>
        </div>
      </div>
      </div>
    </div>

    <footer>A freshly generated shape each time &middot; a rectangle, triangle or pentagon with its sides labelled in terms of x</footer>
  </section>

</div>

<script src="js/config.js"></script>
<script src="js/api-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/working-trail.js"></script>
<script src="js/practice-algebraic-perimeter.js"></script>
<script src="js/page-practice-algebraic-perimeter.js"></script>
</body>
</html>
