<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice: 3D Pythagoras — Vertex Maths</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/practice.css">
<link rel="stylesheet" href="css/exam.css">
</head>
<body>
<div class="wrap wrap-wide" id="page-wrap">

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">Vertex Maths</div>
        <div class="brand-sub">Year 11 &middot; Mathematics</div>
      </div>
    </a>
    <div class="greeting">Kia ora, <b>Amelia</b> &mdash; Room 14</div>
  </div>

  <!-- ============ Practice3DPythagoras component ============ -->
  <section class="view" id="view-practice-3d-pythagoras">

    <div class="breadcrumb">
      <button id="pyth3d-back-btn">← Exam Questions</button>
      <span class="sep">/</span>
      <span class="current">3D Pythagoras</span>
    </div>

    <div class="practice-layout">
      <div class="shape-card">
        <svg id="pyth3d-shape-svg" class="shape-diagram" viewBox="0 0 300 220" role="img" aria-label="A 3D shape with its given lengths labelled"></svg>
        <div class="shape-not-to-scale">Diagram not to scale</div>
      </div>

      <div class="practice-panel-group">
      <div class="practice-panel">
        <div>
          <div class="practice-title">Find the length</div>
        </div>

        <div class="word-problem-statement" id="pyth3d-statement"></div>

        <div class="answer-row">
          <span class="mono" id="pyth3d-prefix">Distance =</span>
          <input type="text" id="pyth3d-answer-input" class="answer-input" inputmode="text" autocomplete="off" aria-label="Answer in cm, to two decimal places">
          <span class="mono">cm</span>
        </div>

        <div class="practice-actions">
          <button class="practice-check-btn" id="pyth3d-check-btn">Check answer</button>
          <button class="practice-next-btn" id="pyth3d-next-btn">New question</button>
        </div>

        <div class="feedback" id="pyth3d-feedback"></div>
        <div class="practice-score-row">Score: <span class="mono" id="pyth3d-score">0 / 0</span></div>
      </div>

      <div class="working-sidebar">
        <div class="working-card" id="pyth3d-working-card" hidden>
          <div class="equation-label">Working</div>
          <div class="working-lines" id="pyth3d-working-lines"></div>
        </div>
      </div>
      </div>
    </div>

    <footer>A freshly generated box, pyramid or triangular prism each time &middot; answers are rounded, not restricted to whole-number lengths</footer>
  </section>

</div>

<script src="js/working-trail.js"></script>
<script src="js/practice-3d-pythagoras.js"></script>
<script src="js/page-practice-3d-pythagoras.js"></script>
</body>
</html>
